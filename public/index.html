<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolão</title>
  <meta name="theme-color" content="#14237A">
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">Bolão</a>
      <nav class="tabs" role="tablist" aria-label="Seções">
        <button type="button" role="tab" id="tab-polls" aria-controls="view-polls" aria-selected="true">Enquetes</button>
        <button type="button" role="tab" id="tab-ranking" aria-controls="view-ranking" aria-selected="false">Ranking</button>
        <button type="button" role="tab" id="tab-prizes" aria-controls="view-prizes" aria-selected="false" hidden>Prêmios</button>
      </nav>
      <div class="head-actions">
        <button id="theme-toggle" class="icon-btn" type="button" title="Mudar o tema" aria-label="Mudar o tema">🌙</button>
        <button id="notify-toggle" class="icon-btn" type="button" title="Ativar notificações" aria-label="Ativar notificações" hidden>🔕</button>
        <div class="who" id="who"></div>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <section id="view-polls" role="tabpanel" aria-labelledby="tab-polls">
      <div class="subtabs" id="topic-tabs" role="tablist" aria-label="Tópicos das enquetes" hidden></div>
      <div id="polls" class="polls" aria-live="polite">
        <p class="note">Carregando enquetes…</p>
      </div>
    </section>

    <section id="view-ranking" role="tabpanel" aria-labelledby="tab-ranking" hidden>
      <div class="subtabs" role="tablist" aria-label="Período do ranking">
        <button type="button" role="tab" id="rtab-weekly" aria-selected="true">Semanal</button>
        <button type="button" role="tab" id="rtab-general" aria-selected="false">Geral</button>
        <button type="button" role="tab" id="rtab-hall" aria-selected="false" hidden>Pikas da semana(lá ele)</button></button>
      </div>
      <div id="ranking"></div>
    </section>

    <section id="view-prizes" role="tabpanel" aria-labelledby="tab-prizes" hidden>
      <div id="prizes"></div>
    </section>

    <section id="view-profile" hidden>
      <div id="profile"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Botões fixos: identidade (cor) acima do chat -->
  <div class="fab-stack" id="fab-stack">
    <div class="identity-fab-wrap">
      <button id="identity-toggle" class="identity-fab" type="button" title="Cor do nome" aria-label="Escolher cor do nome" aria-haspopup="true" hidden>🎨</button>
      <div id="identity-menu" class="identity-menu" hidden role="menu">
        <h4>Cor do nome</h4>
        <div id="identity-swatches" class="identity-swatches"></div>
        <p class="identity-hint">Aparece no chat, ranking e perfil.</p>
      </div>
    </div>
    <button id="chat-toggle" class="chat-fab" type="button" title="Abrir chat" aria-label="Abrir chat" hidden>
      <span class="chat-fab-icon" aria-hidden="true">💬</span>
      <span id="chat-badge" class="chat-badge" hidden>0</span>
    </button>
  </div>

  <aside id="chat-sidebar" class="chat-sidebar" aria-label="Chat" hidden>
    <header class="chat-header">
      <strong>Chat</strong>
      <button id="chat-close" class="icon-btn" type="button" title="Fechar chat" aria-label="Fechar chat">✕</button>
    </header>
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div id="chat-muted" class="chat-muted" hidden></div>
    <div id="chat-attach-bar" class="chat-attach-bar" hidden>
      <div id="chat-attach-preview" class="chat-attach-preview"></div>
      <button type="button" id="chat-attach-clear" class="chat-attach-clear" title="Remover anexo">✕</button>
    </div>
    <div class="chat-form-wrap">
      <div id="chat-suggest" class="chat-suggest" hidden role="listbox" aria-label="Menções"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <button type="button" id="chat-attach-btn" class="chat-attach-btn" title="Anexar imagem ou vídeo" hidden>📎</button>
        <input id="chat-input" type="text" maxlength="500" placeholder="Mensagem… use @ para mencionar" aria-label="Mensagem" autocomplete="off">
        <button type="submit" class="chat-send" title="Enviar">➤</button>
      </form>
    </div>
  </aside>
  <div id="chat-backdrop" class="chat-backdrop" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
