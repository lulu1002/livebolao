services:
  - type: web
    name: bolao
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Senha do painel /admin. O Render gera uma; veja em Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Connection string do Supabase (Session pooler). Você informa ao criar o Blueprint.
      - key: DATABASE_URL
        sync: false
      # Credenciais do app criado em dev.twitch.tv/console
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
